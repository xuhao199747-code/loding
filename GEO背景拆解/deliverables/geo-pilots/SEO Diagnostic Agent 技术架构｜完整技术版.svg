<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
  <title id="title">SEO Diagnostic Agent 技术架构完整技术版</title>
  <desc id="desc">完整保留输入、路由、Agent Skills 与 Tools、四类分析器、评分器、报告器以及两阶段工程标注。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title{font:700 36px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .h{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .t{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#253149}
      .s{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#475569}
      .box{fill:#fff;stroke:#64748b;stroke-width:2;rx:12}
      .agent{fill:#e9f4ff;stroke:#3182ce;stroke-width:2;rx:18}
      .analysis{fill:#ebfbf2;stroke:#38a169;stroke-width:2;rx:12}
      .report{fill:#fff4df;stroke:#dd8b22;stroke-width:2;rx:12}
      .arrow{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:9 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="1080" fill="#f8fafc"/>
  <text x="750" y="58" text-anchor="middle" class="title">SEO Diagnostic Agent</text>

  <rect x="590" y="90" width="320" height="72" class="box"/>
  <text x="750" y="119" text-anchor="middle" class="h">User Request</text>
  <text x="750" y="146" text-anchor="middle" class="t">URL + Keywords</text>

  <path d="M750 162 V205" class="arrow"/>
  <text x="772" y="190" class="s">① Route</text>
  <rect x="590" y="205" width="320" height="82" class="box"/>
  <text x="750" y="238" text-anchor="middle" class="h">RuntimeRouter</text>
  <text x="750" y="266" text-anchor="middle" class="s">description matching</text>

  <path d="M750 287 V330" class="arrow"/>
  <text x="772" y="315" class="s">② Fetch</text>
  <rect x="245" y="330" width="1010" height="250" class="agent"/>
  <text x="750" y="365" text-anchor="middle" class="h">seo-diagnostic-agent</text>

  <rect x="285" y="395" width="580" height="150" class="box"/>
  <text x="310" y="428" class="h">Skills</text>
  <rect x="315" y="449" width="225" height="36" class="box"/>
  <text x="427" y="473" text-anchor="middle" class="s">seo-diagnostic</text>
  <rect x="560" y="449" width="255" height="36" class="box"/>
  <text x="687" y="473" text-anchor="middle" class="s">seo-tech-infra</text>
  <rect x="315" y="495" width="225" height="36" class="box"/>
  <text x="427" y="519" text-anchor="middle" class="s">seo-on-page</text>
  <rect x="560" y="495" width="255" height="36" class="box"/>
  <text x="687" y="519" text-anchor="middle" class="s">seo-structured-data</text>

  <rect x="895" y="395" width="320" height="150" class="box"/>
  <text x="920" y="428" class="h">Tools</text>
  <rect x="925" y="456" width="125" height="64" class="box"/>
  <text x="987" y="494" text-anchor="middle" class="s">web_crawler</text>
  <rect x="1065" y="456" width="125" height="64" class="box"/>
  <text x="1127" y="494" text-anchor="middle" class="s">seo_diagnose</text>

  <path d="M750 580 V628" class="arrow"/>
  <text x="772" y="612" class="s">③ Analyze</text>

  <rect x="145" y="628" width="1110" height="375" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="9 7" rx="18"/>
  <text x="1175" y="978" class="s">Engineering callout</text>
  <rect x="175" y="694" width="185" height="205" class="box"/>
  <text x="267" y="782" text-anchor="middle" class="h">seo_diagnose</text>
  <text x="267" y="812" text-anchor="middle" class="t">Tool</text>

  <rect x="420" y="660" width="350" height="62" class="analysis"/>
  <text x="595" y="699" text-anchor="middle" class="t">technical_analyzer</text>
  <rect x="420" y="738" width="350" height="62" class="analysis"/>
  <text x="595" y="777" text-anchor="middle" class="t">on_page_analyzer</text>
  <rect x="420" y="816" width="350" height="62" class="analysis"/>
  <text x="595" y="855" text-anchor="middle" class="t">schema_analyzer</text>
  <rect x="420" y="894" width="350" height="62" class="analysis"/>
  <text x="595" y="933" text-anchor="middle" class="t">content_analyzer</text>

  <path d="M360 760 H420" class="arrow"/>
  <path d="M360 780 C390 780 390 691 420 691" class="arrow"/>
  <path d="M360 800 C390 800 390 847 420 847" class="arrow"/>
  <path d="M360 820 C390 820 390 925 420 925" class="arrow"/>

  <rect x="850" y="760" width="145" height="145" class="report"/>
  <text x="922" y="815" text-anchor="middle" class="h">④ Score</text>
  <text x="922" y="857" text-anchor="middle" class="t">Scorer</text>
  <path d="M770 691 C820 691 810 800 850 800" class="arrow"/>
  <path d="M770 769 H850" class="arrow"/>
  <path d="M770 847 H850" class="arrow"/>
  <path d="M770 925 C820 925 810 865 850 865" class="arrow"/>

  <rect x="1070" y="760" width="150" height="145" class="report"/>
  <text x="1145" y="815" text-anchor="middle" class="h">⑤ Report</text>
  <text x="1145" y="857" text-anchor="middle" class="t">Reporter</text>
  <path d="M995 832 H1070" class="arrow"/>

  <rect x="1300" y="760" width="175" height="145" class="box"/>
  <text x="1387" y="815" text-anchor="middle" class="t">DiagnosticReport</text>
  <text x="1387" y="847" text-anchor="middle" class="t">JSON (0-100)</text>
  <path d="M1220 832 H1300" class="arrow"/>

  <text x="1280" y="420" class="h">Phase 2</text>
  <text x="1280" y="448" class="t">spawn parallel</text>
  <path d="M1215 488 H1380 V670 H1255" class="dash"/>
  <path d="M1255 715 H1380 V520 H1215" class="dash"/>

  <text x="1275" y="745" class="h">Phase 1</text>
  <text x="1275" y="775" class="t">sequential inside tool</text>
  <path d="M1270 785 L1210 820" class="arrow"/>
</svg>
