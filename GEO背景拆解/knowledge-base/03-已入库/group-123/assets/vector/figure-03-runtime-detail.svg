<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#999"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#111}.title{font-size:32px;font-weight:760}.head{font-size:25px;font-weight:760}.label{font-size:20px}.small{font-size:16px}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="40" y="55" class="title">核心模块流程图</text>

  <g data-node="ui-bot">
    <rect x="40" y="90" width="180" height="730" rx="8" fill="#f3f3f3" stroke="#888"/>
    <text x="130" y="126" text-anchor="middle" class="head">UI/Bot</text>
    <rect x="60" y="150" width="140" height="60" rx="6" fill="#999"/><text x="130" y="188" text-anchor="middle" class="label" font-weight="700">AlphaRanker</text>
    <rect x="60" y="225" width="140" height="60" rx="6" fill="#e5e5e5" stroke="#888"/><text x="130" y="263" text-anchor="middle" class="label">DingTalk</text>
    <rect x="60" y="300" width="140" height="60" rx="6" fill="#e5e5e5" stroke="#888"/><text x="130" y="338" text-anchor="middle" class="label">FeiShu</text>
    <rect x="60" y="375" width="140" height="60" rx="6" fill="#e5e5e5" stroke="#888"/><text x="130" y="413" text-anchor="middle" class="label">Discord</text>
    <rect x="60" y="450" width="140" height="60" rx="6" fill="#e5e5e5" stroke="#888"/><text x="130" y="488" text-anchor="middle" class="label">Telegram</text>
    <rect x="60" y="525" width="140" height="60" rx="6" fill="#e5e5e5" stroke="#888"/><text x="130" y="563" text-anchor="middle" class="label">WhatsApp</text>
    <rect x="60" y="600" width="140" height="60" rx="6" fill="#e5e5e5" stroke="#888"/><text x="130" y="638" text-anchor="middle" class="label">Slack</text>
    <rect x="60" y="675" width="140" height="60" rx="6" fill="#e5e5e5" stroke="#888"/><text x="130" y="713" text-anchor="middle" class="label">Email</text>
    <rect x="60" y="750" width="140" height="50" rx="6" fill="#e5e5e5" stroke="#888"/><text x="130" y="782" text-anchor="middle" class="label">……</text>
  </g>

  <g data-node="personality">
    <rect x="350" y="95" width="900" height="100" rx="10" fill="#f5b1b1" stroke="#888"/>
    <text x="800" y="136" text-anchor="middle" class="head">Personality</text>
    <text x="800" y="168" text-anchor="middle" class="small">geo.md | industry.md | brand.md | team.md | system/agent.md</text>
    <path d="M800 198V250" stroke="#999" stroke-width="4" marker-end="url(#arrow)"/>
  </g>

  <g data-node="gateway">
    <rect x="305" y="365" width="220" height="190" rx="10" fill="#ffc278" stroke="#888"/>
    <text x="415" y="448" text-anchor="middle" class="head">Gateway</text>
    <text x="415" y="481" text-anchor="middle" class="small">ChannelAdapter | Router</text>
  </g>
  <path d="M235 460H285" stroke="#999" stroke-width="4" marker-end="url(#arrow)"/>

  <g data-node="agent-cluster">
    <rect x="610" y="270" width="390" height="390" rx="12" fill="#ffbd69" stroke="#888"/>
    <text x="805" y="310" text-anchor="middle" class="head">GEO-AgenticCluster</text>
    <text x="805" y="345" text-anchor="middle" class="label">CoreAgents</text>
    <rect x="640" y="365" width="150" height="62" rx="6" fill="#ffc778" stroke="#888"/><text x="715" y="403" text-anchor="middle" class="label">PromptBuilder</text>
    <rect x="820" y="365" width="150" height="62" rx="6" fill="#ffc778" stroke="#888"/><text x="895" y="403" text-anchor="middle" class="label">DataAnalyst</text>
    <rect x="640" y="442" width="150" height="76" rx="6" fill="#ffc778" stroke="#888"/><text x="715" y="473" text-anchor="middle" class="label">Strategist</text><text x="715" y="499" text-anchor="middle" class="small">Brand | Industry</text>
    <rect x="820" y="442" width="150" height="76" rx="6" fill="#ffc778" stroke="#888"/><text x="895" y="473" text-anchor="middle" class="label">Diagnosor</text><text x="895" y="499" text-anchor="middle" class="small">Content</text>
    <rect x="640" y="533" width="150" height="62" rx="6" fill="#ffc778" stroke="#888"/><text x="715" y="571" text-anchor="middle" class="label">Optimizer</text>
    <rect x="820" y="533" width="150" height="62" rx="6" fill="#ffc778" stroke="#888"/><text x="895" y="571" text-anchor="middle" class="label">Generator</text>
    <rect x="640" y="608" width="330" height="38" rx="6" fill="#ffc778" stroke="#888"/><text x="805" y="631" text-anchor="middle" class="small">CoordinationType　Private | Group | Team</text>
  </g>
  <path d="M535 460H590" stroke="#999" stroke-width="4" marker-end="url(#arrow)"/>

  <g data-node="llm-router">
    <rect x="1110" y="365" width="240" height="190" rx="10" fill="#ddd" stroke="#888"/>
    <text x="1230" y="470" text-anchor="middle" class="head">LLMRouter</text>
  </g>
  <path d="M1010 460H1090" stroke="#999" stroke-width="4" marker-end="url(#arrow)"/>

  <g data-node="context">
    <rect x="350" y="730" width="900" height="100" rx="10" fill="#a9edf0" stroke="#888"/>
    <text x="800" y="773" text-anchor="middle" class="head">Context</text>
    <text x="800" y="806" text-anchor="middle" class="small">Message | Memory | Tools | Skills</text>
    <path d="M800 725V681" stroke="#999" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
</svg>
