<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#111}
      .title{font-size:32px;font-weight:800}.section{font-size:25px;font-weight:760}.label{font-size:19px;font-weight:680}.detail{font-size:16px}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#050505"/>
  <g data-node="architecture-frame">
    <rect x="70" y="38" width="1460" height="1004" rx="20" fill="#f1f1f1"/>
    <text x="800" y="88" text-anchor="middle" class="title">GEO/AEO Architecture</text>
  </g>

  <g data-node="productization">
    <rect x="92" y="116" width="1416" height="176" rx="12" fill="#d5f7d4" stroke="#777"/>
    <text x="800" y="156" text-anchor="middle" class="section">Productization (GEO Team)</text>
    <rect data-node="prompt-engineer" x="112" y="174" width="216" height="82" rx="10" fill="#b8f5b7" stroke="#777"/><text x="220" y="226" text-anchor="middle" class="label">PromptEngineer</text>
    <rect x="344" y="174" width="216" height="82" rx="10" fill="#b8f5b7" stroke="#777"/><text x="452" y="226" text-anchor="middle" class="label">DataAnlyst</text>
    <rect x="576" y="174" width="216" height="82" rx="10" fill="#b8f5b7" stroke="#777"/><text x="684" y="226" text-anchor="middle" class="label">Strategist</text>
    <rect x="808" y="174" width="216" height="82" rx="10" fill="#b8f5b7" stroke="#777"/><text x="916" y="226" text-anchor="middle" class="label">Opitimizer</text>
    <rect x="1040" y="174" width="216" height="82" rx="10" fill="#b8f5b7" stroke="#777"/><text x="1148" y="226" text-anchor="middle" class="label">Dispatcher</text>
    <rect x="1272" y="174" width="216" height="82" rx="10" fill="#b8f5b7" stroke="#777"/><text x="1380" y="226" text-anchor="middle" class="label">Collecter</text>
  </g>

  <g data-node="agent-teams">
    <rect x="92" y="310" width="1416" height="222" rx="12" fill="#f8bcbc" stroke="#777"/>
    <rect x="112" y="330" width="1376" height="86" rx="10" fill="none" stroke="#777" stroke-dasharray="7 6"/>
    <text x="800" y="368" text-anchor="middle" class="section">Agent Teams</text>
    <text x="800" y="397" text-anchor="middle" class="detail">Private Chat | Group Chat | Team Coordination | Proactive Team</text>
    <rect x="112" y="430" width="1376" height="82" rx="10" fill="none" stroke="#777" stroke-dasharray="7 6"/>
    <text x="800" y="466" text-anchor="middle" class="section">Agent Personality</text>
    <text x="800" y="495" text-anchor="middle" class="detail">geo.md | industry.md | brand.md | team.md | system/agent.md</text>
  </g>

  <g data-node="agentic">
    <rect x="92" y="550" width="1416" height="250" rx="12" fill="#c2f5f7" stroke="#777"/>
    <rect x="112" y="570" width="1376" height="100" rx="10" fill="none" stroke="#777" stroke-dasharray="7 6"/>
    <text x="800" y="610" text-anchor="middle" class="section">Agentic (GEO)</text>
    <text x="800" y="645" text-anchor="middle" class="label">PromptBuild → Crawl → Analysis → Diagnose → Optimize/Generate → Dispatch</text>
    <rect x="112" y="684" width="1376" height="96" rx="10" fill="none" stroke="#777" stroke-dasharray="7 6"/>
    <text x="800" y="724" text-anchor="middle" class="section">ContextEngineering</text>
    <text x="800" y="758" text-anchor="middle" class="label">Memory | Message | Skills | Tools</text>
  </g>

  <g data-node="asset-supply">
    <rect x="92" y="818" width="1416" height="204" rx="12" fill="#bcbaf1" stroke="#777"/>
    <rect x="112" y="838" width="1376" height="72" rx="10" fill="none" stroke="#777" stroke-dasharray="7 6"/>
    <text x="800" y="874" text-anchor="middle" class="section">Asset Supply System</text>
    <text x="800" y="899" text-anchor="middle" class="detail">Context | Knowledge | Content | Agent | Capability/Skills</text>
    <rect x="112" y="924" width="1376" height="78" rx="10" fill="none" stroke="#777" stroke-dasharray="7 6"/>
    <text x="800" y="960" text-anchor="middle" class="section">Data Flywheel (ETLA)</text>
    <text x="800" y="988" text-anchor="middle" class="detail">Collection → Analysis → Learning/Insights → Improve</text>
  </g>
</svg>
